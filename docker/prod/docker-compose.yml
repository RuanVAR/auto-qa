# Production compose. Every service reads from the SAME single .env file
# at the project root (../../.env.production) — one place to set secrets,
# no per-service env duplication.
#
# Usage (preferred):
#   pnpm run deploy:prod      → orchestrated build + migrate + up + health-check
#
# Usage (raw):
#   docker compose -f docker/prod/docker-compose.yml --env-file .env.production up -d
#   docker compose -f docker/prod/docker-compose.yml down
#
# Differences from docker/dev/docker-compose.yml:
#   - Multi-stage production builds (apps/*/Dockerfile, NOT *.dev)
#   - No bind mounts → image is the source of truth
#   - No file watching, no polling
#   - nginx serves the web bundle (port 3000); api on 3001 + 3002 (WS); worker on 3003 (health)

services:
  postgres:
    image: postgres:16-alpine
    container_name: qa-postgres-prod
    restart: always
    env_file: ../../.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qa-redis-prod
    restart: always
    env_file: ../../.env.production
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      cache_from:
        - qa-platform/api:latest
    image: qa-platform/api:latest
    container_name: qa-api-prod
    restart: always
    env_file: ../../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3001:3001'
      # WebSocket gateways (RunsGateway + ScreencastGateway, namespaces / and /screencast)
      - '3002:3002'
    volumes:
      - artifacts_data:/app/artifacts
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:3001/api/v1/health > /dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
      cache_from:
        - qa-platform/worker:latest
    image: qa-platform/worker:latest
    container_name: qa-worker-prod
    restart: always
    env_file: ../../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3003:3003'
    volumes:
      - artifacts_data:/app/artifacts
    shm_size: '2gb'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:3003/health > /dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      cache_from:
        - qa-platform/web:latest
      args:
        # Empty by default → bundle uses relative URLs, nginx proxies /api/*
        # and /socket.io/* to the api container. Override in .env.production
        # only if api is on a different origin (rare for self-hosted).
        VITE_API_URL: ${VITE_API_URL:-}
    image: qa-platform/web:latest
    container_name: qa-web-prod
    restart: always
    env_file: ../../.env.production
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Public-facing HTTP. Override via WEB_HOST_PORT in .env.production
      # if you're running behind a reverse proxy (nginx / traefik / cloudfront)
      # and want the container on a non-privileged port like 8080.
      - '${WEB_HOST_PORT:-80}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:3000/ > /dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  artifacts_data:
