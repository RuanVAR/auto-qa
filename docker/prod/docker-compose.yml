# Production compose. Every service reads from the SAME single .env file
# at the project root (../../.env.production) — one place to set secrets,
# no per-service env duplication.
#
# Usage:
#   pnpm run deploy:prod      → orchestrated build + migrate + up + health-check
#   docker compose -f docker/prod/docker-compose.yml up -d
#
# `--env-file` is NOT required: all secret-bearing values come through
# `env_file:` (loaded into the container's runtime env) and are read by
# the shell at startup via `sh -c '… "$$VAR" …'`. Compose still does
# parse-time interpolation for ${WEB_HOST_PORT:-80} and similar, but
# those have safe defaults — nothing critical breaks without --env-file.
#
# Differences from docker/dev/docker-compose.yml:
#   - Single-stage production builds (pnpm symlinks break in multi-stage COPY)
#   - No bind mounts → image is the source of truth
#   - No file watching, no polling
#   - nginx serves the web bundle (port 3000); api on 3001 + 3002 (WS); worker on 3003 (health)

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    container_name: qa-postgres-prod
    # Resource ceilings. Without these a runaway Chromium in the worker can
    # OOM-kill Postgres — nothing was protected from anything else. Sums to
    # ~1.9G, leaving headroom on the ~2G host. Log rotation is here for the
    # same reason retention exists: unbounded json-file logs fill the disk
    # that Postgres writes WAL to.
    mem_limit: 640m
    memswap_limit: 1g
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    # env_file already loads POSTGRES_USER / _PASSWORD / _DB into the
    # container env, which the official Postgres entrypoint reads on first
    # init. An explicit `environment:` block here would shadow those — and
    # silently resolve to "" if compose were invoked without --env-file,
    # locking new DBs out of their own credentials. Trust env_file.
    env_file: ../../.env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `$$POSTGRES_USER` is the compose-escape for `$POSTGRES_USER` — i.e.
      # the dollar reaches CMD-SHELL verbatim and is expanded at runtime
      # from the env_file-loaded container env. Compose-side `${...}`
      # would otherwise resolve empty without --env-file.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qa-redis-prod
    # Resource ceilings. Without these a runaway Chromium in the worker can
    # OOM-kill Postgres — nothing was protected from anything else. Sums to
    # ~1.9G, leaving headroom on the ~2G host. Log rotation is here for the
    # same reason retention exists: unbounded json-file logs fill the disk
    # that Postgres writes WAL to.
    mem_limit: 128m
    memswap_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    env_file: ../../.env.production
    # `sh -c` lets the shell read REDIS_PASSWORD from the env_file-loaded
    # container env at startup, instead of compose interpolating it at
    # parse-time. `$$` escapes compose's `$` substitution so the literal
    # `$REDIS_PASSWORD` reaches the shell. This is what makes
    # `docker compose up` work without an --env-file flag — previously
    # a recreate without that flag produced `--requirepass ""` and Redis
    # crash-looped on "wrong number of arguments".
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      # Same $$-escape rationale as postgres above.
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: qa-platform/api:latest
    container_name: qa-api-prod
    # Resource ceilings. Without these a runaway Chromium in the worker can
    # OOM-kill Postgres — nothing was protected from anything else. Sums to
    # ~1.9G, leaving headroom on the ~2G host. Log rotation is here for the
    # same reason retention exists: unbounded json-file logs fill the disk
    # that Postgres writes WAL to.
    mem_limit: 384m
    memswap_limit: 768m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    env_file: ../../.env.production
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Bound to loopback only — the public entrypoint is the web container
      # (nginx proxies /api → :3001 and /socket.io → :3002 over the internal
      # docker network). Keeping these on 127.0.0.1 lets the host run health
      # checks / debugging without exposing the API to the internet.
      - '127.0.0.1:3001:3001'
      - '127.0.0.1:3002:3002'
    volumes:
      - artifacts_data:/app/artifacts
    healthcheck:
      # Use 127.0.0.1 not 'localhost' — inside the container /etc/hosts only
      # maps 'localhost' to ::1 (IPv6), but the API binds to 0.0.0.0 (IPv4).
      # wget probes IPv6 first and gives up. Forcing IPv4 sidesteps the issue.
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3001/api/v1/health > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: qa-platform/worker:latest
    # No container_name (docs/plan/06-PHASE-4-SCALE.md §4.3, horizontal
    # scaling): a fixed name makes `docker compose up --scale worker=N` fail
    # outright — container names must be unique. Every other service here
    # keeps its container_name deliberately (postgres/redis/api/web are
    # meant to stay single-instance); the worker is the one built to scale.
    # Resource ceilings. Without these a runaway Chromium in the worker can
    # OOM-kill Postgres — nothing was protected from anything else. Sums to
    # ~1.9G, leaving headroom on the ~2G host. Log rotation is here for the
    # same reason retention exists: unbounded json-file logs fill the disk
    # that Postgres writes WAL to.
    mem_limit: 768m
    memswap_limit: 1536m
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    env_file: ../../.env.production
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No published port (§4.3): a fixed host-port mapping (previously
    # '127.0.0.1:3003:3003', kept for host-side /health + /ready curling)
    # would ALSO block scaling — removing just container_name isn't enough,
    # since N replicas can't all bind the same host port. Docker's own
    # healthcheck below runs inside the container's network namespace and
    # needs no published port; to reach a specific replica's :3003 from the
    # host for debugging, use `docker compose exec --index=N worker curl ...`.
    volumes:
      - artifacts_data:/app/artifacts
    shm_size: '2gb'
    healthcheck:
      # bookworm-slim has no wget/curl — use node (guaranteed present since
      # the app is node). Also forces IPv4 to dodge the same localhost→::1
      # issue the api/web checks would otherwise hit.
      # /ready is the cheap HTTP-only ack — /health launches a real Chromium
      # on every poll which can exceed the 5 s timeout under start-up load.
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3003/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Capacity-gated: enable explicitly with `--profile indexing` only after the
  # host has at least 4 GB RAM or the indexer is moved to a separate host.
  indexer:
    profiles: ['indexing']
    build:
      context: ../..
      dockerfile: apps/indexer/Dockerfile
    image: qa-platform/indexer:latest
    restart: always
    env_file: ../../.env.production
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
      CODE_INDEX_CONCURRENCY: ${CODE_INDEX_CONCURRENCY:-1}
      CODE_INDEX_JOBS_PER_MINUTE: ${CODE_INDEX_JOBS_PER_MINUTE:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3004/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # Empty by default → bundle uses relative URLs, nginx proxies /api/*
        # and /socket.io/* to the api container. Override in .env.production
        # only if api is on a different origin (rare for self-hosted).
        VITE_API_URL: ${VITE_API_URL:-}
        # Platform display name baked into the bundle (index.html title + first
        # paint). Set APP_NAME in .env.production; the live name is also fetched
        # from the API at runtime.
        VITE_APP_NAME: ${APP_NAME:-AdVantage}
        # Sentry DSNs are public client identifiers, not credentials. The
        # secret-bearing API/worker DSN stays runtime-only in env_file.
        VITE_SENTRY_DSN: ${SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
        VITE_GIT_SHA: ${GIT_SHA:-unknown}
    image: qa-platform/web:latest
    container_name: qa-web-prod
    # Resource ceilings. Without these a runaway Chromium in the worker can
    # OOM-kill Postgres — nothing was protected from anything else. Sums to
    # ~1.9G, leaving headroom on the ~2G host. Log rotation is here for the
    # same reason retention exists: unbounded json-file logs fill the disk
    # that Postgres writes WAL to.
    mem_limit: 64m
    memswap_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    env_file: ../../.env.production
    depends_on:
      api:
        condition: service_started
    ports:
      # Public-facing HTTP. Override via WEB_HOST_PORT in .env.production
      # if you're running behind a reverse proxy (nginx / traefik / cloudfront)
      # and want the container on a non-privileged port like 8080.
      - '${WEB_HOST_PORT:-80}:3000'
    healthcheck:
      # 127.0.0.1 not 'localhost' — same IPv4/IPv6 reason as api above.
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/ > /dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  artifacts_data:
