name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  # Standards gate — runs Biome on the CI runner (not the 2 GB server) before
  # any deploy. Lenient by design: only error-level rules fail the build;
  # style/a11y nits are warnings. Edit biome.json to tune.
  lint:
    name: Biome standards check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # --ignore-scripts skips prisma generate / playwright browser downloads —
      # Biome's binary is an optionalDependency, so it's available without them.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint

  deploy:
    name: SSH Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/qa_platform

            echo "==> Ensuring swap is active (prevents OOM during builds)..."
            if [ ! -f /swapfile ]; then
              echo "    Creating 4G swapfile..."
              sudo fallocate -l 4G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            elif ! swapon --show | grep -q /swapfile; then
              sudo swapon /swapfile
            fi
            echo "    Swap: $(swapon --show | tail -1)"

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Installing daily Docker cleanup cron (idempotent)..."
            CRON_CMD="0 3 * * * /bin/bash $HOME/qa_platform/scripts/docker-cleanup.sh >> /var/log/docker-cleanup.log 2>&1"
            ( crontab -l 2>/dev/null | grep -v 'docker-cleanup.sh' ; echo "$CRON_CMD" ) | crontab -

            echo "==> Pre-deploy Docker cleanup..."
            bash scripts/docker-cleanup.sh

            echo "==> Running production deploy (build + migrate + up)..."
            bash scripts/deploy-prod.sh

            echo "==> Running DB seed (idempotent)..."
            docker compose -f docker/prod/docker-compose.yml --env-file .env.production \
              run --rm --no-deps api sh -c "pnpm exec prisma db seed" || echo "Seed skipped (no changes)"

            echo "==> Final cleanup..."
            docker image prune -f

            echo "==> Deploy complete!"
