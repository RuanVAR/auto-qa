name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy to Lightsail
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/qa_platform

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Running production deploy (build + migrate + up)..."
            bash scripts/deploy-prod.sh

            echo "==> Running DB seed (idempotent)..."
            docker compose -f docker/prod/docker-compose.yml --env-file .env.production \
              run --rm --no-deps api sh -c "pnpm exec prisma db seed" || echo "Seed skipped (no changes)"

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Deploy complete!"
