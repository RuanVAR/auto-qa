name: Deploy to Production

on:
  push:
    branches:
      - main

# Two pushes in quick succession previously launched two overlapping SSH deploys
# that both `git reset --hard` the same checkout and drove the same Docker
# daemon. Serialise them; never cancel one mid-migration.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pre-deploy gate — runs on the CI runner, not the 2 GB server.
  #
  # This used to be Biome only, which meant code that did not compile passed the
  # gate and failed on the production host AFTER the old containers had already
  # been recreated. Typecheck now runs here, where failing is free.
  #
  # Unit tests (shared/api/worker) ran here too for a while, but they added
  # several minutes to every single deploy — paid on every push regardless of
  # what changed. Run them locally / in a separate on-demand workflow instead;
  # this gate stays fast enough that nobody is tempted to skip it.
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # --ignore-scripts skips playwright browser downloads; prisma generate is
      # run explicitly below because the typecheck needs the generated client.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Biome is lenient by design: only error-level rules fail the build.
      - name: Lint
        run: pnpm lint

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Build shared packages
        run: pnpm --filter "@qa-platform/*" build

      - name: Typecheck api
        run: pnpm --filter api exec tsc --noEmit
      - name: Typecheck worker
        run: pnpm --filter worker exec tsc --noEmit
      - name: Typecheck web
        run: pnpm --filter web exec tsc --noEmit

  deploy:
    name: SSH Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/qa_platform

            echo "==> Ensuring swap is active (prevents OOM during builds)..."
            if [ ! -f /swapfile ]; then
              echo "    Creating 4G swapfile..."
              sudo fallocate -l 4G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            elif ! swapon --show | grep -q /swapfile; then
              sudo swapon /swapfile
            fi
            echo "    Swap: $(swapon --show | tail -1)"

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Pre-deploy Docker cleanup..."
            bash scripts/docker-cleanup.sh

            echo "==> Running production deploy (build + migrate + up)..."
            bash scripts/deploy-prod.sh

            echo "==> Running DB seed (idempotent)..."
            docker compose -f docker/prod/docker-compose.yml --env-file .env.production \
              run --rm --no-deps api sh -c "pnpm exec prisma db seed" || echo "Seed skipped (no changes)"

            echo "==> Final cleanup..."
            docker image prune -f

            echo "==> Deploy complete!"
