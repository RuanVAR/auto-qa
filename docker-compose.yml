version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    container_name: qa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_password}
      POSTGRES_DB: ${POSTGRES_DB:-qa_platform}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qa_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-qa_redis_password}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-qa_redis_password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: qa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-qa_user}:${POSTGRES_PASSWORD:-qa_password}@postgres:5432/${POSTGRES_DB:-qa_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-qa_redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me}
      # AI provider — see .env.example for full documentation
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_AZURE_INSTANCE: ${AI_AZURE_INSTANCE:-}
      AI_AZURE_DEPLOYMENT: ${AI_AZURE_DEPLOYMENT:-}
      AI_AZURE_API_VERSION: ${AI_AZURE_API_VERSION:-}
      # Legacy keys — still respected as fallback
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODE_INDEX_ENABLED: ${CODE_INDEX_ENABLED:-false}
      CODE_INDEX_CRON: ${CODE_INDEX_CRON:-0 1 * * *}
      CODE_INDEX_STALE_HOURS: ${CODE_INDEX_STALE_HOURS:-24}
      CODE_INDEX_CRON_BATCH_SIZE: ${CODE_INDEX_CRON_BATCH_SIZE:-25}
      ARTIFACT_STORAGE_PATH: /app/artifacts
      # Secrets KEK — encrypts AI/Git creds AND (Phase 5c) env credentials +
      # env variables at rest. Same key must be on the worker (it decrypts).
      SECRETS_KEK: ${SECRETS_KEK:-}
      SECRETS_KEK_KEY_ID: ${SECRETS_KEK_KEY_ID:-}
      SECRETS_KEK_PREVIOUS: ${SECRETS_KEK_PREVIOUS:-}
      SECRETS_KEK_PREVIOUS_KEY_ID: ${SECRETS_KEK_PREVIOUS_KEY_ID:-}
    ports:
      - '3001:3001'
    volumes:
      - artifacts_data:/app/artifacts

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: qa-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qa_user}:${POSTGRES_PASSWORD:-qa_password}@postgres:5432/${POSTGRES_DB:-qa_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-qa_redis_password}@redis:6379
      ARTIFACT_STORAGE_PATH: /app/artifacts
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      # Phase 5c — worker decrypts per-env credentials + encrypted env vars at
      # run start. MUST match the API's SECRETS_KEK.
      SECRETS_KEK: ${SECRETS_KEK:-}
      SECRETS_KEK_KEY_ID: ${SECRETS_KEK_KEY_ID:-}
      SECRETS_KEK_PREVIOUS: ${SECRETS_KEK_PREVIOUS:-}
      SECRETS_KEK_PREVIOUS_KEY_ID: ${SECRETS_KEK_PREVIOUS_KEY_ID:-}
      # Full-run video recording (Phase 5a) — set false to disable
      RECORD_VIDEO: ${RECORD_VIDEO:-true}
    volumes:
      - artifacts_data:/app/artifacts
    shm_size: '2gb'

  indexer:
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    container_name: qa-indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qa_user}:${POSTGRES_PASSWORD:-qa_password}@postgres:5432/${POSTGRES_DB:-qa_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-qa_redis_password}@redis:6379
      SECRETS_KEK: ${SECRETS_KEK:-}
      SECRETS_KEK_KEY_ID: ${SECRETS_KEK_KEY_ID:-}
      SECRETS_KEK_PREVIOUS: ${SECRETS_KEK_PREVIOUS:-}
      SECRETS_KEK_PREVIOUS_KEY_ID: ${SECRETS_KEK_PREVIOUS_KEY_ID:-}
      CODE_INDEX_CONCURRENCY: ${CODE_INDEX_CONCURRENCY:-1}
      CODE_INDEX_JOBS_PER_MINUTE: ${CODE_INDEX_JOBS_PER_MINUTE:-4}
      CODE_INDEX_MAX_ARCHIVE_MB: ${CODE_INDEX_MAX_ARCHIVE_MB:-250}
      CODE_INDEX_MAX_EXTRACTED_MB: ${CODE_INDEX_MAX_EXTRACTED_MB:-750}
      CODE_INDEX_MAX_FILES: ${CODE_INDEX_MAX_FILES:-50000}
      CODE_INDEX_MAX_FILE_MB: ${CODE_INDEX_MAX_FILE_MB:-2}
      CODE_INDEX_MAX_PATH_LENGTH: ${CODE_INDEX_MAX_PATH_LENGTH:-1024}
      CODE_INDEX_EMBED_BATCH_SIZE: ${CODE_INDEX_EMBED_BATCH_SIZE:-64}
      CODE_INDEX_INSERT_BATCH_SIZE: ${CODE_INDEX_INSERT_BATCH_SIZE:-64}
      CODE_INDEX_STATEMENT_TIMEOUT_MS: ${CODE_INDEX_STATEMENT_TIMEOUT_MS:-30000}
    ports:
      - '3004:3004'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: qa-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
  artifacts_data:
