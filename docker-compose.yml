version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_password}
      POSTGRES_DB: ${POSTGRES_DB:-qa_platform}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qa_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-qa_redis_password}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-qa_redis_password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: qa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-qa_user}:${POSTGRES_PASSWORD:-qa_password}@postgres:5432/${POSTGRES_DB:-qa_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-qa_redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me}
      # AI provider — see .env.example for full documentation
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_AZURE_INSTANCE: ${AI_AZURE_INSTANCE:-}
      AI_AZURE_DEPLOYMENT: ${AI_AZURE_DEPLOYMENT:-}
      AI_AZURE_API_VERSION: ${AI_AZURE_API_VERSION:-}
      # Legacy keys — still respected as fallback
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTIFACT_STORAGE_PATH: /app/artifacts
    ports:
      - '3001:3001'
    volumes:
      - artifacts_data:/app/artifacts

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: qa-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qa_user}:${POSTGRES_PASSWORD:-qa_password}@postgres:5432/${POSTGRES_DB:-qa_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-qa_redis_password}@redis:6379
      ARTIFACT_STORAGE_PATH: /app/artifacts
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
    volumes:
      - artifacts_data:/app/artifacts
    shm_size: '2gb'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: qa-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
  artifacts_data:
