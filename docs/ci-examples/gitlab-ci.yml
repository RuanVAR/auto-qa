publish_qa_release:
  stage: deploy
  image: alpine:3.20
  needs: ["deploy"]
  before_script:
    - apk add --no-cache bash curl jq
  variables:
    QA_RELEASE_VERSION: "$CI_COMMIT_TAG"
    QA_COMMIT_SHA: "$CI_COMMIT_SHA"
    QA_BRANCH: "$CI_COMMIT_REF_NAME"
    QA_PIPELINE_URL: "$CI_PIPELINE_URL"
    QA_IDEMPOTENCY_KEY: "gitlab:$CI_PROJECT_ID:$CI_PIPELINE_ID:$CI_JOB_ID"
  script:
    - export QA_RELEASE_VERSION="${QA_RELEASE_VERSION:-$CI_COMMIT_SHORT_SHA}"
    - bash scripts/publish-environment-release.sh
